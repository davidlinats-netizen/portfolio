name: Refine work card interactions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply refined interaction to all work cards
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the old large play-circle treatment.
          s = re.sub(r'\.visual:after\{content:"▶";.*?\}', '', s, count=1)

          # Replace any previous hover-note block with the reusable minimal version.
          marker = '/* Minimal project callout on every work card */'
          start = s.find(marker)
          if start != -1:
              end = s.find('.work-info{', start)
              if end != -1:
                  s = s[:start] + '''/* Minimal project callout on every work card */
.work .visual{cursor:crosshair}
.hover-note{position:absolute;left:50%;top:50%;width:min(290px,68%);padding:14px 16px;border:1px solid color-mix(in srgb,var(--text) 20%,transparent);border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);box-shadow:0 18px 45px rgba(0,0,0,.16);opacity:0;transform:translate(-22%,-50%) translateY(8px) scale(.96);pointer-events:none;transition:opacity .3s var(--ease),transform .45s var(--ease);z-index:3}
.hover-note:before{content:"";position:absolute;left:-58px;top:50%;width:58px;height:1px;background:var(--accent);transform:rotate(-18deg);transform-origin:right center;opacity:0;transition:opacity .25s ease}
.hover-note:after{content:"↗";position:absolute;left:-76px;top:calc(50% - 17px);color:var(--accent);font-size:17px;opacity:0;transform:translate(-4px,4px);transition:opacity .25s ease,transform .4s var(--ease)}
.work:hover .hover-note{opacity:1;transform:translate(-22%,-50%) translateY(0) scale(1)}
.work:hover .hover-note:before,.work:hover .hover-note:after{opacity:1}
.work:hover .hover-note:after{transform:translate(0,0)}
.note-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}
.hover-note h4{font-size:16px;margin:5px 0 4px;letter-spacing:-.02em}
.hover-note p{font-size:11px;color:var(--muted);line-height:1.5}
''' + s[end:]
          else:
              # Insert the CSS before work-info if the marker is absent.
              css = '''/* Minimal project callout on every work card */
.work .visual{cursor:crosshair}
.hover-note{position:absolute;left:50%;top:50%;width:min(290px,68%);padding:14px 16px;border:1px solid color-mix(in srgb,var(--text) 20%,transparent);border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);box-shadow:0 18px 45px rgba(0,0,0,.16);opacity:0;transform:translate(-22%,-50%) translateY(8px) scale(.96);pointer-events:none;transition:opacity .3s var(--ease),transform .45s var(--ease);z-index:3}
.hover-note:before{content:"";position:absolute;left:-58px;top:50%;width:58px;height:1px;background:var(--accent);transform:rotate(-18deg);transform-origin:right center;opacity:0;transition:opacity .25s ease}
.hover-note:after{content:"↗";position:absolute;left:-76px;top:calc(50% - 17px);color:var(--accent);font-size:17px;opacity:0;transform:translate(-4px,4px);transition:opacity .25s ease,transform .4s var(--ease)}
.work:hover .hover-note{opacity:1;transform:translate(-22%,-50%) translateY(0) scale(1)}
.work:hover .hover-note:before,.work:hover .hover-note:after{opacity:1}
.work:hover .hover-note:after{transform:translate(0,0)}
.note-label{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}
.hover-note h4{font-size:16px;margin:5px 0 4px;letter-spacing:-.02em}
.hover-note p{font-size:11px;color:var(--muted);line-height:1.5}
'''
              pos=s.find('.work-info{')
              if pos!=-1: s=s[:pos]+css+s[pos:]

          descriptions=[
            ('High-retention social edit','Built around a strong hook, tight pacing, captions and sound design to keep attention moving.'),
            ('Motion-led brand content','Uses kinetic typography, purposeful transitions and compositing to make the message feel alive.'),
            ('Long-form storytelling','Focused on structure, pacing and clean narrative flow so longer videos stay engaging.'),
            ('Content built to perform','Combines platform-native editing with strong hooks, rhythm and retention-focused creative choices.')]

          cards=list(re.finditer(r'<article class="work">.*?</article>',s,re.S))
          if len(cards)>=4:
              offset=0
              for i,m in enumerate(cards[:4]):
                  block=m.group(0)
                  block=re.sub(r'<div class="hover-note">.*?</div>', '', block, count=1, flags=re.S)
                  title,desc=descriptions[i]
                  note=f'<div class="hover-note"><div class="note-label">Project note</div><h4>{title}</h4><p>{desc}</p></div>'
                  block=block.replace('</div><div class="work-info">',note+'</div><div class="work-info">',1)
                  a,b=m.span(); a+=offset; b+=offset
                  s=s[:a]+block+s[b:]
                  offset+=len(block)-(m.end()-m.start())

          # Ensure compact mobile placement.
          if '@media(max-width:800px){' in s:
              s=s.replace('@media(max-width:800px){','@media(max-width:800px){.hover-note{left:46%;top:52%;width:min(270px,72%)}.hover-note:before{left:-38px;width:38px}.hover-note:after{left:-55px}',1)
          p.write_text(s,encoding='utf-8')
      - name: Remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/refine-work-cards.yml
          git commit -m "Refine all work card hover interactions" || exit 0
          git push