name: Portfolio refinement
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine marquee and tools
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.group{display:flex;align-items:center;gap:28px;padding-right:28px}', '.group{display:flex;align-items:center;gap:28px;padding-right:28px;flex-shrink:0}')
          old='''<div class="tools"><span>Premiere Pro</span><span>After Effects</span><span>CapCut</span><span>Content Strategy</span><span>Meta Ads</span></div>'''
          new='''<div class="tools"><span>Premiere Pro</span><span>After Effects</span><span>CapCut</span><span>Canva</span><span>ChatGPT</span><span>Claude</span><span>Gemini</span><span>Google Flow</span><span>Higgsfield</span><span>Seedance 2.5</span><span>GitHub</span><span>Vercel</span></div>'''
          if old not in s: raise SystemExit('About tools block not found')
          s=s.replace(old,new,1)
          marker='''</div></div></section>\n<section id="contact">'''
          tools_section='''</div></div></section>\n<section id="tools-showcase"><div class="wrap"><div class="head"><div><div class="kicker">Tools & workflow</div><h2 class="title">The tools behind<br>the work.</h2></div><p class="desc">A practical creative stack for editing, design, AI-assisted production and modern project workflows.</p></div><div class="tools"><span>Premiere Pro</span><span>After Effects</span><span>CapCut</span><span>Canva</span><span>ChatGPT</span><span>Claude</span><span>Gemini</span><span>Google Flow</span><span>Higgsfield</span><span>Seedance 2.5</span><span>GitHub</span><span>Vercel</span></div></div></section>\n<section id="contact">'''
          if marker not in s: raise SystemExit('Contact marker not found')
          s=s.replace(marker,tools_section,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine marquee and add tools section"
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/portfolio-finalize.yml
          git commit -m "Remove one-time portfolio workflow"
          git push
