name: Fix video player

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-video-player:
    if: ${{ !startsWith(github.event.head_commit.message, 'Fix inline YouTube player') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize YouTube player controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('controls=0', 'controls=1')
          s = s.replace('pointer-events:none', 'pointer-events:auto')
          s = s.replace('allow="autoplay; encrypted-media"', 'allow="autoplay; encrypted-media; picture-in-picture"')
          p.write_text(s)
          PY

      - name: Commit player fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Fix inline YouTube player"
          git push